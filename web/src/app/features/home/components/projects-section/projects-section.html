<section class="section projects" aria-labelledby="projects-title">
  <div class="container projects-layout">
    <div class="projects-intro">
      <p class="section-label">Espacios que inspiran</p>
      <h2 id="projects-title">Proyectos realizados</h2>
      <p class="projects-description">Conoce algunos de los espacios que transformamos con nuestros pisos.</p>
      <a class="btn btn-primary" routerLink="/proyectos">Ver más proyectos <span aria-hidden="true">→</span></a>
    </div>

    <div class="projects-carousel">
      <button class="carousel-control previous" type="button" aria-label="Ver proyecto anterior"
        aria-controls="projects-track" (click)="scrollProjects(projectTrack, -1)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6" /></svg>
      </button>
      <div #projectTrack class="projects-track" id="projects-track" tabindex="0"
        role="region" aria-label="Proyectos realizados, desplázate para ver más">
        @for (project of projects; track project.slug) {
          <article class="project-card">
            <a [routerLink]="['/proyectos', project.slug]">
              <div class="project-image">
                <img #projectImage [src]="'/images/projects/' + project.slug + '.jpg'"
                  (error)="projectImage.src = '/images/hero/hero01.jpeg'"
                  alt="" width="640" height="500" loading="lazy" />
              </div>
              <div class="project-details">
                <h3>{{ project.name }}</h3>
                <p>{{ project.material }}</p>
              </div>
            </a>
          </article>
        }
      </div>
      <button class="carousel-control next" type="button" aria-label="Ver siguiente proyecto"
        aria-controls="projects-track" (click)="scrollProjects(projectTrack, 1)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6" /></svg>
      </button>
    </div>
  </div>
</section>
