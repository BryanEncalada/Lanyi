<section class="section blog" aria-labelledby="blog-title">
  <div class="container">
    <div class="blog-header">
      <div>
        <p class="section-label">Consejos y novedades</p>
        <h2 class="section-title" id="blog-title">Últimas publicaciones</h2>
      </div>
      <a class="all-posts" routerLink="/blog">Ver todas las publicaciones <span aria-hidden="true">→</span></a>
    </div>

    <div class="blog-grid">
      @for (post of posts; track post.slug) {
        <article class="post-card">
          <a class="post-link" [routerLink]="['/blog', post.slug]">
            <div class="post-image">
              <img #postImage [src]="'/images/blog/' + post.image"
                (error)="postImage.src = '/images/hero/hero01.jpeg'"
                alt="" width="800" height="300" loading="lazy" />
            </div>
            <div class="post-content">
              <h3>{{ post.title }}</h3>
              <p>{{ post.description }}</p>
              <time [attr.datetime]="post.date">{{ post.displayDate }}</time>
            </div>
          </a>
        </article>
      }
    </div>
  </div>
</section>
