<section id="blog" class="section blog" aria-labelledby="blog-title">
  <div class="container">
    <div class="section-heading">
      <div>
        <p class="section-label">Consejos y novedades</p>
        <h2 class="section-title" id="blog-title">Últimas publicaciones</h2>
      </div>
      <a class="text-link" routerLink="/blog">
        Ver todas las publicaciones <app-icon name="arrow" />
      </a>
    </div>
    <div class="blog-grid">
      @for (post of posts; track post.slug; let i = $index) {
        <article class="post-card">
          <a class="post-link" [routerLink]="['/blog', post.slug]">
            <div class="post-image">
              <app-reference-photo [rect]="photos[i]" [alt]="post.title" />
            </div>
            <div class="post-content">
              <h3>{{ post.title }}</h3>
              <p>{{ post.description }}</p>
              <time [attr.datetime]="post.date">{{ post.displayDate }}</time>
            </div>
          </a>
        </article>
      }
    </div>
  </div>
</section>
