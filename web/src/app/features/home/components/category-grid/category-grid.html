<section class="categories" aria-label="Categorías de productos">
  <div class="container categories-grid">
    @for (category of categories; track category.slug) {
      <a
        class="category-card"
        [queryParams]="query(category.slug)"
        [routerLink]="
          category.slug === 'zocalos' || category.slug === 'accesorios' ? '/accesorios' : '/pisos'
        "
      >
        <app-reference-photo [rect]="category.photo" [alt]="category.name" /><span
          class="category-name"
          >{{ category.name }}</span
        ><span class="category-arrow"><app-icon name="arrow" /></span
      ></a>
    }
  </div>
</section>
