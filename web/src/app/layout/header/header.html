<header class="site-header">
  <div class="header-inner container">
    <a routerLink="/" class="logo" (click)="closeMenu()" aria-label="Lanyi Pisos, inicio"
      >Lanyi<span>PISOS &amp; ACABADOS</span></a
    >
    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-navigation"
      aria-label="Abrir o cerrar menú"
    >
      ☰
    </button>
    <nav id="main-navigation" class="navigation" [class.open]="menuOpen()" aria-label="Principal">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
        >Inicio</a
      >
      <a routerLink="/nosotros" routerLinkActive="active" (click)="closeMenu()">Nosotros</a>
      <a routerLink="/pisos" routerLinkActive="active" (click)="closeMenu()"
        >Pisos <span>⌄</span></a
      >
      <a routerLink="/accesorios" routerLinkActive="active" (click)="closeMenu()"
        >Accesorios <span>⌄</span></a
      >
      <a routerLink="/proyectos" (click)="closeMenu()">Proyectos</a>
      <a routerLink="/blog" (click)="closeMenu()">Blog</a>
      <a routerLink="/" fragment="contacto" (click)="closeMenu()">Contacto</a>
    </nav>
  </div>
</header>
